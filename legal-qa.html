<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Handyman Services</title>
<style>
.lg-scroll{overflow:auto;max-height:64vh;border:1px solid #9aa8b0;border-radius:8px;background:#dce2e6;-webkit-overflow-scrolling:touch}
.lg-wrap{position:relative;width:100%;background:#fff}.lg-wrap canvas{width:100%;display:block}.lg-ov{position:absolute;inset:0;overflow:hidden}
.lg-item{position:absolute;outline:1.5px dashed #b3261e;outline-offset:1px;background:rgba(242,194,48,.22);touch-action:none;cursor:grab;line-height:1.25;white-space:pre-wrap;word-break:break-word;color:#000;padding:0;margin:0}
.lg-item.sel{outline:2.5px solid var(--ac);background:rgba(15,92,92,.12)}.lg-item img{display:block;width:100%;pointer-events:none}.lg-item svg{display:block;pointer-events:none}
.sigbox{border:1px solid var(--ln);border-radius:6px;max-height:80px;background:#fff}
.qa-thumbs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:6px}.qa-thumbs img{width:100%;height:80px;object-fit:cover;border:1px solid var(--ln);border-radius:6px}
</style>

<body>
<script src="core.js"></script>
<script>
"use strict";
/* LEGAL + QA: the QA Portal (15 task checklists, photos, signatures, branded paginated PDF)
   and the Legal Document workspace (templates, fillable fields, manual text/signature placement).
   Query parameters: v=qa|legal, job=<jobId> (start QA / add legal doc), open=<reportId> (view a QA report). */

const TASKS={
 'Garden gate repair':['Is the gate frame, post and surrounding structure sound enough for the repair?','Are hinges, fixings and latch suitable and securely fitted?','Does the gate open and close freely without dragging?','Is the latch working and does the gate remain secure when closed?','Have sharp edges, debris and trip hazards been removed?'],
 'Hanging shelves or hooks':['Has the wall type and likely service location been checked?','Are the fixings suitable for the wall and expected load?','Are the brackets, hooks or supports level and securely fixed?','Has the installation been checked for movement or looseness?','Has the work area been left clean and safe?'],
 'Replacing silicone sealant':['Has the old sealant been removed and the surfaces cleaned?','Are the surfaces dry and suitable for the selected sealant?','Has the correct sealant been selected for the location?','Is the new bead continuous, neatly tooled and free from gaps?','Have curing instructions and any use restrictions been explained?'],
 'Flat-pack furniture assembly':['Have all parts and fixings been checked against the instructions?','Has the unit been assembled in the correct orientation?','Are all required fixings tightened and components secure?','Is the furniture stable and safely positioned?','Have packaging and unused fixings been cleared away?'],
 'Painting and decorating':['Have surfaces been prepared and protected appropriately?','Have suitable materials and finishes been used?','Is coverage even and are edges and cut-ins tidy?','Have drips, splashes and defects been checked and addressed?','Has the area been left clean with drying/ventilation advice given?'],
 'Minor plumbing repair':['Has the water supply been isolated where necessary?','Are fittings and replacement parts suitable for the installation?','Have connections been checked for leaks under operating conditions?','Are valves and appliances operating as expected?','Has the customer been told about any limitations or follow-up needed?'],
 'Door adjustment or repair':['Are the door, frame and hinges in sound condition?','Have hinges and fixings been tightened or adjusted correctly?','Does the door open and close without binding?','Are the latch and handles operating correctly?','Have sharp edges and debris been removed?'],
 'Curtain pole or blind installation':['Has the wall or ceiling substrate been checked?','Are brackets and fixings suitable for the load and substrate?','Are brackets aligned, level and securely fixed?','Does the pole/blind operate correctly and safely?','Have dust and debris been removed?'],
 'Tile or grout repair':['Have loose or damaged areas been identified and prepared?','Are replacement materials compatible with the existing finish?','Are grout lines or sealant joints continuous and neatly finished?','Has excess material been removed without damaging surfaces?','Have curing and cleaning instructions been explained?'],
 'Fence panel repair':['Are posts and supporting structures stable?','Are replacement panels and fixings suitable for the location?','Are panels secured and aligned correctly?','Are exposed edges and fixings safe?','Has the area been cleared of offcuts and debris?'],
 'Lock or handle replacement':['Is the replacement hardware compatible with the door or window?','Have fixings been installed securely?','Does the lock, latch or handle operate smoothly?','Has key operation and locking been tested with the customer?','Have keys and relevant operating information been handed over?'],
 'Gutter or downpipe minor repair':['Has safe access been established for the work?','Are joints, brackets and components correctly fitted?','Are connections secure and aligned?','Has water flow or leakage been checked where practicable?','Have access equipment and debris been removed safely?'],
 'Picture or mirror hanging':['Has the wall type and item weight been considered?','Are fixings and hanging hardware appropriate?','Is the item level and securely supported?','Has stability been checked without risking damage?','Has the work area been left clean and safe?'],
 'General maintenance':['Have the requested tasks and work area been confirmed with the customer?','Are materials, tools and fixings suitable for the work?','Has the work been completed to the agreed scope?','Have completed items been checked for safe operation and stability?','Have defects, limitations or follow-up actions been recorded?'],
 'Other / bespoke task':['Has the work scope and expected outcome been agreed with the customer?','Have relevant materials, tools and fixing methods been checked?','Has the work been completed to the agreed scope?','Have the completed works been checked for safe operation and finish?','Have any limitations, defects or follow-up actions been explained?']
};
const views={};
let cur={v:'qa'};
const act=(t,o)=>t.objectStore('activity').put(HM.newActivity(o));
async function show(v,params={}){cur={v,...params};HM.setQuery(v==='qaReport'?{v:'qa',open:params.id}:cur);await HM.render(()=>views[v](params))}

/* ---------- shared PDF text helpers ---------- */
const winAnsi=s=>String(s??'').replace(/\r/g,'').replace(/\t/g,' ').replace(/[^\n\x20-\x7E\xA0-\xFF\u2018\u2019\u201C\u201D\u2013\u2014\u2022\u2026\u20AC]/g,'?');
function wrapLines(text,font,size,max){const out=[];for(const para of winAnsi(text).split('\n')){if(!para.trim()){out.push('');continue}let line='';for(let word of para.split(/\s+/)){if(!word)continue;
  while(font.widthOfTextAtSize(word,size)>max){let k=word.length;while(k>1&&font.widthOfTextAtSize(word.slice(0,k),size)>max)k--;if(line){out.push(line);line=''}out.push(word.slice(0,k));word=word.slice(k)}
  const test=line?line+' '+word:word;if(font.widthOfTextAtSize(test,size)>max&&line){out.push(line);line=word}else line=test}out.push(line)}return out}
const hexRgb=h=>{const v=String(h||'#0f5c5c').replace('#','');return PDFLib.rgb(parseInt(v.slice(0,2),16)/255||0,parseInt(v.slice(2,4),16)/255||0,parseInt(v.slice(4,6),16)/255||0)};

/* ================= QA PORTAL ================= */
views.qa=async()=>{const js=(await HM.all('jobs')).map(HM.norm.job).sort((a,b)=>b.created-a.created),rs=(await HM.all('qaReports')).sort((a,b)=>b.created-a.created);
 return `<h2>QA Portal</h2><div class="c"><p>Choose a job to create its quality report. Each work type has its own inspection questions.</p>${js.map(j=>`<div class="row"><span><b>${esc(j.ref)}</b><div class="m">${esc(j.customerName)} · ${esc(j.task||j.description)}</div></span><button onclick="qaForm('${esc(j.id)}')">Start QA</button></div>`).join('')||'<p class="m">Create a job first (Jobs page), then start its QA report.</p>'}</div>
 <div class="c"><h3>Recent QA reports</h3>${rs.slice(0,30).map(r=>`<div class="row"><span><b>${esc(r.taskType)}</b><div class="m">${esc(r.jobRef)} · ${esc(HM.dateFmt(r.workDate))} · ${esc(r.customerName)}</div></span><span><button class="secondary small-btn" onclick="show('qaReport',{id:'${esc(r.id)}'})">View</button><button class="small-btn" onclick="openQAPdf('${esc(r.id)}')">PDF</button></span></div>`).join('')||'<p class="m">No QA reports yet.</p>'}</div>`};

const ansCls={Yes:'ok','No':'bad'};
views.qaReport=async p=>{const r=await HM.get('qaReports',p.id);if(!r)return '<p>QA report not found.</p><button onclick="show(\'qa\')">Back</button>';
 return `<button class="secondary small-btn" onclick="show('qa')">‹ QA Portal</button><h2>${esc(r.taskType)}</h2><div class="c"><div class="m">${esc(r.jobRef)} · ${esc(HM.dateFmt(r.workDate))}</div>
 <p><b>${esc(r.customerName)}</b><br><span class="m" style="white-space:pre-wrap">${esc(r.jobAddress||r.customerAddress)}</span></p><p style="white-space:pre-wrap">${esc(r.workDescription)}</p>
 <button class="w" onclick="openQAPdf('${esc(r.id)}')">PDF: share, open or save</button><button class="secondary w" onclick="HM.go('job',{id:'${esc(r.jobId)}'})">Go to job</button></div>
 <div class="c"><h3>Checklist</h3>${(r.answers||[]).map((a,i)=>`<div class="question"><b>${i+1}. ${esc(a.question)}</b><div><span class="tag ${ansCls[a.answer]||'grey'}">${esc(a.answer)}</span></div>${a.note?`<div class="m" style="white-space:pre-wrap">${esc(a.note)}</div>`:''}${a.photos&&a.photos.length?`<div class="qa-thumbs">${a.photos.map(ph=>`<img src="${ph.data}" alt="Evidence photo">`).join('')}</div>`:''}</div>`).join('')}</div>
 ${r.photos&&r.photos.length?`<div class="c"><h3>Additional photographs (${r.photos.length})</h3><div class="qa-thumbs">${r.photos.map(ph=>`<img src="${ph.data}" alt="Job photo">`).join('')}</div></div>`:''}
 <div class="c"><h3>Confirmation</h3><p class="m">Customer comments: ${esc(r.customerNotes||'none')}</p><div class="row"><span>Customer</span><b>${esc(r.customerConfirmName)}</b></div><img class="sigbox" src="${r.customerSignature}" alt="Customer signature"><div class="row"><span>Handyman</span><b>${esc(r.handymanName)}</b></div><img class="sigbox" src="${r.handymanSignature}" alt="Handyman signature">
 <div class="row"><span>Amount charged</span><b>${GBP(r.amountCharged)}</b></div><div class="row"><span>Payment status at the time</span><b>${esc(r.paymentStatus||'')}</b></div></div>`};

/* ----- QA form ----- */
let qaPhotos={general:[],q:{}},qaPads={};
function paymentText(job,invoices,pays){const s=HM.jobSummary(job.id,invoices,pays);if(!s.invoiceCount)return 'No invoice issued yet';
 if(s.status.startsWith('Previously'))return s.status;return s.status==='Paid'?'Paid':`${s.status} (${GBP(s.outstanding)} outstanding)`}
async function qaForm(jobId){qaPhotos={general:[],q:{}};qaPads={};const j0=await HM.get('jobs',jobId);if(!j0)return toast('Job not found');const j=HM.norm.job(j0);
 const [invs,pays]=await Promise.all([HM.all('invoices'),HM.all('payments')]);const js=HM.jobSummary(j.id,invs,pays);
 const type=j.task&&TASKS[j.task]?j.task:'General maintenance',charged=js.invoiced||j.amount||0;
 HM.modal(`<h2>Quality assurance report</h2><p class="m">${esc(j.ref)} · ${esc(j.customerName)}</p><form id="qaForm" onsubmit="return false">
 <label>Task type</label><select id="qaType" name="taskType" onchange="qaTypeChanged()" required>${Object.keys(TASKS).map(t=>`<option ${t===type?'selected':''}>${esc(t)}</option>`).join('')}</select>
 <label>Customer name</label><input name="customerName" value="${esc(j.customerName)}" required>
 <label>Customer address</label><textarea name="customerAddress">${esc(j.customerAddress)}</textarea>
 <label>Handyman name</label><input name="handymanName" value="${esc(HM.brand.name)}" required>
 <label>Job address</label><textarea name="jobAddress">${esc(j.customerAddress)}</textarea>
 <label>Work carried out / detailed description</label><textarea name="workDescription" required>${esc(j.description)}</textarea>
 <label>Date work was carried out (can be backdated)</label><input name="workDate" type="date" value="${HM.today()}" required>
 <div id="qaQuestions"></div>
 <div class="c"><h3>Additional photographic evidence</h3><p class="small">Photos added to individual checks appear beside those checks in the report. Add general job photographs here.</p><input type="file" accept="image/*" multiple onchange="addPhotos(this,'g')"><div id="photoPreview" class="evidence-grid"></div></div>
 <label>Additional customer notes</label><textarea name="customerNotes" placeholder="Optional comments from the customer"></textarea>
 <label>Amount charged (£)</label><input name="amountCharged" type="number" step=".01" min="0" value="${charged}">
 <div class="row"><span>Payment status</span><b>${esc(paymentText(j,invs,pays))}</b></div><p class="small">Payment status is taken from the job's invoices and recorded payments at the time the report is saved.</p>
 <div class="c"><h3>Customer confirmation</h3><p class="small">I confirm that I have reviewed the details in this QA report and that they accurately record the work and checks discussed with me. Any comments or concerns are recorded above.</p><label>Customer confirmation name</label><input name="customerConfirmName" value="${esc(j.customerName)}" required><label><input type="checkbox" name="customerConfirmed" value="yes" required> I confirm that the customer has reviewed and agreed to this report.</label><label>Customer signature</label><canvas class="signature" id="customerSignature"></canvas><button type="button" class="secondary" onclick="qaPads.customer.clear()">Clear customer signature</button></div>
 <div class="c"><h3>Handyman declaration</h3><p class="small">I confirm that this report is an accurate record of the work and checks I carried out to the best of my knowledge.</p><label>Handyman signature</label><canvas class="signature" id="handymanSignature"></canvas><button type="button" class="secondary" onclick="qaPads.handyman.clear()">Clear handyman signature</button></div>
 <button type="button" class="w" onclick="saveQA('${esc(jobId)}')">Save QA report and generate PDF</button></form>`);
 renderQuestions();qaPads.customer=HM.signaturePad($('#customerSignature'));qaPads.handyman=HM.signaturePad($('#handymanSignature'))}
function qaTypeChanged(){const has=qaPhotos.q&&Object.values(qaPhotos.q).some(a=>a.length);if(has&&!confirm('Changing the task type clears the checklist answers and the photos attached to the checks. Continue?')){return}renderQuestions()}
function renderQuestions(){qaPhotos.q={};const type=$('#qaType').value,qs=TASKS[type];
 $('#qaQuestions').innerHTML=`<div class="c"><h3>Task-specific inspection checklist</h3><p class="small">Answer every question. Use Not Applicable only when the check genuinely does not apply.</p>${qs.map((q,i)=>`<div class="question"><b>${i+1}. ${esc(q)}</b><div class="answers">${['Yes','No','Not Applicable'].map(a=>`<label><input type="radio" name="answer${i}" value="${a}" required>${a}</label>`).join('')}</div><label class="small">Notes (optional)</label><textarea name="note${i}" placeholder="Record details, defects or follow-up actions"></textarea><label class="small">Photos for this check</label><input type="file" accept="image/*" multiple onchange="addPhotos(this,'${i}')"><div id="questionPhotos${i}" class="evidence-grid"></div></div>`).join('')}</div>`}
async function addPhotos(input,key){const files=[...input.files];input.value='';if(!files.length)return;toast('Processing photos…');const arr=key==='g'?qaPhotos.general:(qaPhotos.q[key]=qaPhotos.q[key]||[]);let bad=0;
 for(const f of files){try{arr.push({name:f.name,type:'image/jpeg',data:await HM.compressImage(f,1600,0.82)})}catch(e){bad++}}
 renderPhotos(key);if(bad)toast(bad+' file(s) could not be used. Please choose image files.')}
function renderPhotos(key){const arr=key==='g'?qaPhotos.general:(qaPhotos.q[key]||[]),el=key==='g'?$('#photoPreview'):$('#questionPhotos'+key);if(el)el.innerHTML=arr.map((p,i)=>`<div class="evidence-item"><img src="${p.data}" alt="Evidence photo"><button type="button" class="danger" onclick="removePhoto('${key}',${i})">✕</button></div>`).join('')}
function removePhoto(key,i){(key==='g'?qaPhotos.general:qaPhotos.q[key]).splice(i,1);renderPhotos(key)}

function saveQA(jobId){HM.guard('saveQA',async()=>{const form=$('#qaForm');if(!form.reportValidity())return;const f=HM.formData('qaForm');
 if(qaPads.customer.isEmpty()||qaPads.handyman.isEmpty())return toast('Both the customer and handyman signatures are required');
 const qs=TASKS[f.taskType];if(!qs)return toast('Choose a task type');
 const answers=qs.map((q,i)=>({question:q,answer:form.querySelector(`[name="answer${i}"]:checked`)?.value||'',note:f['note'+i]||'',photos:(qaPhotos.q[i]||[]).slice()}));
 if(answers.some(a=>!a.answer))return toast('Please answer every QA question');
 const j0=await HM.get('jobs',jobId);if(!j0)return toast('Job not found');const [invs,pays]=await Promise.all([HM.all('invoices'),HM.all('payments')]);
 const now=Date.now(),report={id:HM.uid(),jobId,customerId:j0.customerId||'',jobRef:j0.ref,taskType:f.taskType,customerName:f.customerName,customerAddress:f.customerAddress,handymanName:f.handymanName,jobAddress:f.jobAddress,workDescription:f.workDescription,workDate:f.workDate,customerNotes:f.customerNotes||'',amountCharged:Number(f.amountCharged)||0,paymentStatus:paymentText(HM.norm.job(j0),invs,pays),customerConfirmName:f.customerConfirmName,customerConfirmed:f.customerConfirmed||'yes',
  answers,photos:qaPhotos.general.slice(),customerSignature:qaPads.customer.toDataURL(),handymanSignature:qaPads.handyman.toDataURL(),brandSnapshot:HM.brandSnapshot(),created:now};
 await HM.tx(['qaReports','jobs','activity'],'readwrite',async t=>{t.objectStore('qaReports').put(report);
  act(t,{jobId,customerId:report.customerId,type:'qa_completed',description:`QA report completed: ${report.taskType}`,linkedType:'qa',linkedId:report.id});
  const j=await HM.rq(t.objectStore('jobs').get(jobId));if(j){j.task=j.task||report.taskType;if(!['Completed','Cancelled'].includes(j.status)){const prev=j.status||'Enquiry';j.status='Completed';act(t,{jobId,customerId:j.customerId,type:'status_changed',description:`Job status changed: ${prev} → Completed (QA report completed)`,linkedType:'job',linkedId:jobId,meta:{from:prev,to:'Completed'}})}j.updated=now;t.objectStore('jobs').put(j)}});
 HM.closeModal();toast('QA report saved');await show('qaReport',{id:report.id});
 try{await HM.presentPdf(await makeQAPdf(report),pdfName(report),'QA report '+report.jobRef)}catch(e){console.error(e);toast('Report saved, but the PDF could not be created: '+e.message+'. Tap PDF to try again.')}})}
const pdfName=r=>HM.safeName(`${r.jobRef}_QA_Report_${r.workDate}`)+'.pdf';
function openQAPdf(id){HM.guard('qapdf'+id,async()=>{const r=await HM.get('qaReports',id);if(!r)return toast('Report not found');await HM.presentPdf(await makeQAPdf(r),pdfName(r),'QA report '+r.jobRef)})}

/* ----- QA PDF: vector text, embedded photos, saved branding snapshot, full pagination ----- */
async function makeQAPdf(r){await HM.ensurePdfLib();const {PDFDocument,StandardFonts,rgb}=PDFLib,b=r.brandSnapshot||HM.brand;
 const pdf=await PDFDocument.create(),font=await pdf.embedFont(StandardFonts.Helvetica),bold=await pdf.embedFont(StandardFonts.HelveticaBold);
 const W=595,H=842,M=42,BOTTOM=86,CW=W-2*M,brandCol=hexRgb(b.color),ink=rgb(.08,.14,.18),grey=rgb(.35,.41,.45),white=rgb(1,1,1),green=rgb(.11,.48,.26),red=rgb(.7,.15,.12);
 async function embed(d){if(!d)return null;try{const by=HM.dataUrlToBytes(d);return /^data:image\/png/.test(d)?await pdf.embedPng(by):await pdf.embedJpg(by)}catch(e){try{const im=await HM.imageFromData(d),c=document.createElement('canvas');c.width=im.naturalWidth;c.height=im.naturalHeight;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0);return await pdf.embedJpg(HM.dataUrlToBytes(c.toDataURL('image/jpeg',.85)))}catch(e2){return null}}}
 const logo=await embed(b.logo);let page,y,first=true;
 const T=(t,x,yy,size,f,col)=>page.drawText(winAnsi(t),{x,y:yy,size,font:f||font,color:col||ink});
 const right=(t,yy,size,f,col)=>{const s=winAnsi(t);page.drawText(s,{x:W-M-(f||font).widthOfTextAtSize(s,size),y:yy,size,font:f||font,color:col||white})};
 function newPage(){page=pdf.addPage([W,H]);
  if(first){page.drawRectangle({x:0,y:H-76,width:W,height:76,color:brandCol});let x=M;if(logo){const s=Math.min(46/logo.width,46/logo.height);page.drawImage(logo,{x,y:H-14-46+(46-logo.height*s)/2-4,width:logo.width*s,height:logo.height*s});x+=logo.width*s+12}
   T(b.name||'Handyman Services',x,H-34,17,bold,white);if(b.slogan)T(b.slogan,x,H-52,9,font,white);right('QUALITY ASSURANCE REPORT',H-34,10,bold);y=H-100;first=false}
  else{page.drawRectangle({x:0,y:H-44,width:W,height:44,color:brandCol});T(b.name||'',M,H-27,12,bold,white);right('QA REPORT · '+(r.jobRef||''),H-27,9,font);y=H-68}}
 const ensure=h=>{if(y-h<BOTTOM)newPage()};
 const heading=t=>{ensure(66);y-=6;T(t,M,y,11.5,bold,brandCol);y-=5;page.drawLine({start:{x:M,y},end:{x:W-M,y},thickness:.8,color:brandCol});y-=14};
 const kv=(k,v)=>{const ls=wrapLines(v||'-',font,10,CW-125);ensure(ls.length*13+4);T(k,M,y,9.5,bold);for(const l of ls){T(l,M+125,y,10);y-=13}y-=2};
 const para=(t,size=10,x=M,col)=>{for(const l of wrapLines(t,font,size,W-M-x)){ensure(size+5);T(l,x,y,size,font,col);y-=size+4}y-=4};
 async function photos(list,label){if(!list||!list.length)return;ensure(20);T(label,M+8,y,8,bold,grey);y-=8;const bw=160,bh=120,gap=10,per=3;
  for(let i=0;i<list.length;i+=per){ensure(bh+10);const row=list.slice(i,i+per);for(let k=0;k<row.length;k++){const x=M+8+k*(bw+gap);page.drawRectangle({x,y:y-bh,width:bw,height:bh,borderColor:rgb(.8,.84,.86),borderWidth:.6});const im=await embed(row[k].data);
   if(im){const s=Math.min((bw-4)/im.width,(bh-4)/im.height),w=im.width*s,h=im.height*s;page.drawImage(im,{x:x+(bw-w)/2,y:y-bh+(bh-h)/2,width:w,height:h})}else T('Photo unavailable',x+8,y-bh/2,8,font,grey)}y-=bh+10}}
 async function signature(label,name,data){ensure(105);T(label,M,y,9.5,bold);const im=await embed(data);page.drawRectangle({x:M,y:y-76,width:190,height:70,borderColor:rgb(.8,.84,.86),borderWidth:.6});
  if(im){const s=Math.min(182/im.width,62/im.height);page.drawImage(im,{x:M+4,y:y-74+(66-im.height*s)/2,width:im.width*s,height:im.height*s})}y-=88}
 newPage();
 heading('JOB AND CUSTOMER DETAILS');kv('Job reference',r.jobRef);kv('Customer',r.customerName);kv('Customer address',r.customerAddress);kv('Handyman',r.handymanName);kv('Work address',r.jobAddress);kv('Work date',HM.dateFmt(r.workDate));kv('Task type',r.taskType);y-=4;
 heading('WORK CARRIED OUT');para(r.workDescription);y-=2;
 heading('TASK-SPECIFIC QA CHECKLIST');
 for(let i=0;i<(r.answers||[]).length;i++){const a=r.answers[i],ql=wrapLines(`${i+1}. ${a.question}`,bold,9.5,CW);ensure(ql.length*12+30);for(const l of ql){T(l,M,y,9.5,bold);y-=12}
  T('Answer: '+a.answer,M+8,y,9.5,bold,a.answer==='Yes'?green:a.answer==='No'?red:grey);y-=14;
  if(a.note){for(const l of wrapLines('Notes: '+a.note,font,9,CW-8)){ensure(13);T(l,M+8,y,9);y-=12}y-=2}
  await photos(a.photos,'PHOTO EVIDENCE');y-=6}
 heading('CUSTOMER NOTES');para(r.customerNotes||'No additional customer notes recorded.');
 if(r.photos&&r.photos.length){heading('ADDITIONAL JOB PHOTOGRAPHS');await photos(r.photos,'JOB PHOTOGRAPHS (' + r.photos.length + ')')}
 heading('CUSTOMER CONFIRMATION');para('I confirm that I have reviewed the details in this QA report and that they accurately record the work and checks discussed with me.');kv('Customer name',r.customerConfirmName);await signature('Customer signature',r.customerConfirmName,r.customerSignature);

  $('#lgText').value='';$('#lgPreset').value='';L.presetKey=''}
 else if(L.mode==='check'){const size=Math.max(11,Number($('#lgSize').value)||11);p={kind:'check',value:'',size,w:size,presetKey:'',label:'Tick',u:clamp(u-(size/2)/W,.97),v:clamp(v-(size/2)/H,.97)}}
 else{const pad=L.mode==='sigP'?L.padP:L.padC,cv=pad===L.padP?$('#lgSigP'):$('#lgSigC'),w=160,h=w/(cv.width/cv.height);p={kind:'signature',value:'',size:0,w,aspect:cv.width/cv.height,data:pad.toDataURL(),presetKey:'',label:L.mode==='sigP'?'Provider signature':'Customer signature',u:clamp(u-(w/2)/W,1-w/W),v:clamp(v-(h/2)/H,1-h/H)}}
 p.id=HM.uid();p.page=L.page;L.placements.push(p);L.mode=null;const hn=$('#lgHint');hn.textContent='Placed. Drag it to fine-tune, or choose another item.';hn.style.fontWeight='400';legalOverlay();legalSelect(p.id);legalList()}
function legalList(){const el=$('#lgList');if($('#lgCount'))$('#lgCount').textContent=L.placements.length;if(!el)return;
 el.innerHTML=L.placements.map((p,i)=>`<div class="row"><span>${i+1}. ${esc(p.label||'Item')}${p.kind==='text'?': '+esc(p.value.slice(0,36)):''} <span class="small">(page ${p.page})</span></span><span><button class="secondary small-btn" onclick="legalShow('${p.id}')">Show</button><button class="danger small-btn" onclick="legalRemove('${p.id}')">Remove</button></span></div>`).join('')||'<p class="small">Nothing placed yet.</p>'}
async function legalShow(id){const p=L.placements.find(x=>x.id===id);if(!p)return;if(p.page!==L.page){L.page=p.page;$('#lgPageSel').value=String(p.page);await legalRender()}legalSelect(id);$('#lgScroll').scrollIntoView({block:'nearest'})}
function legalRemove(id){L.placements=L.placements.filter(p=>p.id!==id);if(L.sel===id)L.sel=null;legalOverlay();legalSelect(L.sel);legalList()}

/* Map a point in "display" points (top-left of the page as shown, rotation applied) back to the PDF's own
   coordinate space, honouring page rotation and the CropBox. */
function toUser(page,du,dv){const cb=page.getCropBox(),r=((page.getRotation().angle%360)+360)%360,w=cb.width,h=cb.height;let x,y;
 if(r===0){x=du;y=h-dv}else if(r===90){x=dv;y=du}else if(r===180){x=w-du;y=dv}else{x=w-dv;y=h-du}return{x:cb.x+x,y:cb.y+y,r,dw:(r%180?h:w),dh:(r%180?w:h)}}

function legalSave(fromEditor){HM.guard('legalSave',async()=>{const P=PDFLib;
 if(!fromEditor){L.values=readFieldValues();L.signatory=$('#lgSignatory')?.value||''}
 if(fromEditor&&!L.placements.length&&!L.fields.length)return toast('Place at least one text entry, tick or signature first');
 const pdf=await P.PDFDocument.load(L.bytes.slice());   // always a fresh working copy
 if(L.fields.length){try{applyFields(pdf,L.fields,L.values)}catch(e){return toast('A field value could not be applied: '+e.message)}
  try{pdf.getForm().flatten()}catch(e){console.warn('flatten failed',e);toast('Saved with fields left editable (they could not be flattened).')}}
 const font=await pdf.embedFont(P.StandardFonts.Helvetica);
 for(const p of L.placements){const page=pdf.getPage(p.page-1),q0=toUser(page,0,0),du=p.u*q0.dw,dv=p.v*q0.dh;
  if(p.kind==='text'){const s=p.size||9.5,pt=toUser(page,du,dv+s*0.97);if(!String(p.value).trim())continue;
   page.drawText(winAnsi(p.value),{x:pt.x,y:pt.y,size:s,font,color:P.rgb(0,0,0),lineHeight:s*1.25,maxWidth:Math.max(30,Math.min(p.w||195,q0.dw-du-4)),rotate:P.degrees(pt.r)})}
  else if(p.kind==='check'){const s=p.size||11,pts=[[.15,.55],[.40,.85],[.88,.15]].map(([a,b])=>toUser(page,du+a*s,dv+b*s));
   for(let i=0;i<2;i++)page.drawLine({start:{x:pts[i].x,y:pts[i].y},end:{x:pts[i+1].x,y:pts[i+1].y},thickness:Math.max(1,s*.13),color:P.rgb(0,0,0),lineCap:P.LineCapStyle.Round})}
  else{const img=await pdf.embedPng(HM.dataUrlToBytes(p.data)),w=p.w,h=w/p.aspect,pt=toUser(page,du,dv+h);page.drawImage(img,{x:pt.x,y:pt.y,width:w,height:h,rotate:P.degrees(pt.r)})}}
 const out=await pdf.save(),blob=new Blob([out],{type:'application/pdf'}),data=await HM.blobToDataUrl(blob),j=L.job,t=L.template,now=Date.now();
 const rec={id:HM.uid(),type:'legal',jobId:j.id,jobRef:j.ref,customerId:j.customerId||'',templateId:t.id,templateName:t.name,name:t.name+' - '+j.ref,filename:HM.safeName(j.ref+'_'+t.name)+'_completed.pdf',data,signatory:L.signatory||'',
  entries:L.placements.map(p=>({kind:p.kind,page:p.page})),created:now};
 await HM.tx(['docs','activity'],'readwrite',async tx=>{tx.objectStore('docs').put(rec);act(tx,{jobId:j.id,customerId:j.customerId,type:'doc_added',description:'Legal document completed: '+t.name,linkedType:'doc',linkedId:rec.id})});
 // Remember reusable layout (text + ticks only; never signatures). The PDF data of the template is not touched.
 if(fromEditor&&$('#lgRemember')&&$('#lgRemember').checked){const lay=L.placements.filter(p=>p.kind!=='signature').map(p=>({kind:p.kind,page:p.page,u:p.u,v:p.v,size:p.size,w:p.w,presetKey:p.presetKey||'',label:p.label,defaultValue:p.presetKey?'':p.value}));
  if(lay.length){const tt=await HM.get('templates',t.id);if(tt){tt.savedLayout=lay;await HM.put('templates',tt)}}}
 HM.closeModal();L=null;toast('Completed legal PDF saved against '+j.ref);await show('legal')})}

/* ================= START ================= */
const q0=HM.query(),wantLegal=q0.v==='legal'||q0.tab==='legal'||q0.action==='start-legal'||!!q0.docId;
HM.init(wantLegal?'legal':'qa').then(async()=>{const q=HM.query(),job=q.job||q.jobId,open=q.open||q.reportId;
 if(wantLegal){await show('legal');if(q.docId)openLegalDoc(q.docId);else if(job)chooseLegalTemplate(job)}
 else if(open)await show('qaReport',{id:open});
 else{await show('qa');if(job)qaForm(job)}}).catch(()=>{});
</script>
